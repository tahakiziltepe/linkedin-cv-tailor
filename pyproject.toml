[project]
name = "antigravity-cv-builder"
version = "1.0.0"
description = "Automated LinkedIn job search with AI screening and tailored CV (Typst/PDF) generation"
readme = "README.md"
license = "MIT"
authors = [{ name = "M. Taha Kiziltepe" }]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.2",
    "google-genai>=1.60.0",
    "pandas<3.0.0",
    "python-dotenv>=1.2.1",
    "python-jobspy>=1.1.82",
    "typst>=0.14.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: gercek Gemini API cagrisi yapar (RUN_LIVE_TESTS=1)",
    "clean: temiz makine simulasyonu (yavas)",
]
